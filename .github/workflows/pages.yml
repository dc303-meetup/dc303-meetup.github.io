name: Deploy Jekyll site to Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Least-privilege token, plus the OIDC + pages scopes the deploy step needs.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two publishes at once; let an in-flight one finish.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Installs the gems from the Gemfile (the github-pages gem, which pins the
      # exact Jekyll + plugin versions GitHub Pages itself runs) and caches them.
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      # `future: true` lives in _config.yml, but pass --future explicitly so the
      # "upcoming meetings" logic still works if that config line is ever dropped.
      - name: Build with Jekyll
        run: bundle exec jekyll build --future --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    # Only publish from main; pull_request runs are build-only checks.
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
