- q: do i need to be a denhac member to attend?
  a: >-
    no, you do not need to be a member. if the door is locked, please reach out using the
    details on the <a href="/contacts.html">contacts page</a> or call the phone number
    posted on the common area glass door.
- q: is on-site parking available?
  a: >-
    yes. on meetup days, parking is free on the front/side lots next to denhac, as well as the lot
    directly across 7th Avenue.
- q: has denhac been closed by the 2026 Santa Fe road construction?
  a: >-
    no, denhac remains open. you can access the building by turning in from Kalamath
    street, or by using the alley located to the south of denhac and west of Santa Fe.
    incidentally, roadwork for the week often ends before friday evening meetups.
- q: do you accept talk proposals?
  a: >-
    yes, we are always accepting talk proposals. feel free to reach out via the
    <a href="/contacts.html">contacts page</a>.
