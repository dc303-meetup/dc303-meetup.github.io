<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.title != site.title %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }} — {{ site.tagline }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ site.rss_path | absolute_url }}">
</head>

<body>
  <a class="skip-link" href="#main">skip to content</a>

  <header class="banner">
    <p class="banner__brand"><a href="{{ '/' | relative_url }}">dc303</a> <span class="muted">// {{ site.tagline }}</span></p>
    {% include nav.html label="main" collapsible=true %}
  </header>

  <main class="content" id="main">
    <h1 class="page-title">{{ page.heading | default: page.title }}</h1>
    {{ content }}
  </main>

  <footer class="footer">
    {% include nav.html label="secondary" %}
    <p class="footer__meta">
      updated {{ site.time | date: "%Y-%m-%d" }} ·
      <a href="{{ site.rss_path | relative_url }}">rss feed</a>
    </p>
  </footer>
</body>

</html>
